[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nestapi-python"
version = "1.0.2"
description = "Feature-rich sync and async Python SDK for NestAPI with dynamic routing and typed exceptions"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
    { name = "Hossein Saberi", email = "devh3n@duck.com" },
    { name = "Ali Raeesi", email = "liaraeesi@gmail.com"}
]
keywords = ["nestapi", "ai", "sdk", "api-client", "httpx", "async"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "httpx>=0.27,<1"
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "build>=1.2",
    "twine>=5",
]

[project.urls]
"Homepage" = "https://nestapi.ir"
"Source" = "https://github.com/devh3n/nestapi-py"
"Bug Tracker" = "https://github.com/devh3n/nestapi-py/issues"


[tool.setuptools.packages.find]
where = ["."]
include = ["NestApi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
